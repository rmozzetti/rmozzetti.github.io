<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Aion 2</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <link rel="stylesheet" href="css/styles.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
<header>
<img src="img/banner.jpg" alt="Aion 2 logo">
</header>
<main>
<div class="container-fluid">
<div class="row justify-content-center">
<div class="col-12">
  <h2>Aion 2 Steam Statistics</h2>
  <label for="statSelect">Select a Statistic:</label>
  <select id="statSelect">
     <option value="">Select a Statistic</option>
     <option value="players">Current Player Count</option>
     <option value="achievements">Total Reviews</option>
  </select>
  <button type="button" id="checkStats">Check Statistics</button>
  <div id="statResults"></div>

  <h2>Recent Aion 2 News</h2>
  <div id="news">
     <div class="newsArticle">
        <h3 id="newsTitle1"></h3>
        <a id="newsURL1">Read More</a>
     </div>
     <div class="newsArticle">
        <h3 id="newsTitle2"></h3>
        <a id="newsURL2">Read More</a>
     </div>
     <div class="newsArticle">
        <h3 id="newsTitle3"></h3>
        <a id="newsURL3">Read More</a>
     </div>
  </div>

</div>
</div>
</div>
</main>
<footer>
  <p>&copy; 2026 Robert Mozzetti. All rights reserved.</p>
  <p>This site is for academic purposes only.</p>
  <p>CST 336 Internet Programming.</p>
  <img src="img/logo.jpg" alt="CSUMB logo">
</footer>
<script src="js/script.js"></script>
</body>
</html>
