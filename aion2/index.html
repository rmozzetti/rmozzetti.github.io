<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Aion 2 Marketplace Price Check</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <link rel="stylesheet" href="css/styles.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
<header>
<h1>Aion 2 Marketplace Price Check</h1>
</header>
<main>
<div class="container">
<div class="row justify-content-center">
<div class="col-12 col-md-8 col-lg-6">
<form>
  <p>Select an item to check its marketplace price. (NAE Siel)</p>

  <label for="itemSelect">Select an item:</label>

  <select id="itemSelect">
    <option value="">-- Select an Item --</option>
    <option value="kinaChest">10,000,000 Kina Chest</option>
    <option value="wrathfulOmen">Wrathful Omen</option>
    <option value="wrathfulWill">Wrathful Will</option>
    <option value="wrathfulMind">Wrathful Mind</option>
    <option value="radiantOdyle">Radiant Odyle</option>
  </select>

  <button type="button" id="checkPriceButton">Check Price</button>

  <div id="results"></div>

  <p id="lastUpdated">Last updated: </p>
    
</form>
</div>
</div>
</div>
</main>

</footer>
<script src="js/script.js"></script>
</body>
</html>
