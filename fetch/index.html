<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title> Sign Up Page </title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <link rel="stylesheet" href="css/styles.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
<header>
<h1> Sign Up Form</h1>
</header>
<main>
<div class="container">
<div class="row justify-content-center">
<div class="col-12 col-md-8 col-lg-6">
<form id="signupForm" action="welcome.html">
  <label> First Name:
    <input type="text" id="fName" name="fName">
  </label><br>

  <label>Last Name:
     <input type="text" id="lName" name="lName">
  </label><br>

  <label>Gender:</label>
  <label><input type="radio" name="gender" value="m"> Male</label>
  <label><input type="radio" name="gender" value="f"> Female</label><br>

  <label>Zip Code:
     <input type="text" id="zip" name="zip">
  </label><br>

  <label>City: <span id="city"></span></label><br>
  <label>Latitude: <span id="latitude"></span></label><br>
  <label>Longitude: <span id="longitude"></span></label><br>

<label>State:
  <select id="state" name="state">
    <option value="">Loading states...</option>
  </select>
</label><br>

  <label>Select a County:
     <select id="county" name="county"></select>
  </label><br>

  <label>Desired Username:
     <input type="text" id="username" name="username">
  </label>
  <span id="usernameError"></span><br>

  <label>Password:
  <input type="password" id="password" name="password" onclick="suggestPassword()">
  </label>
  <span id="suggestedPassword"></span><br>

  <label>Type Password Again:
     <input type="password" id="passwordAgain" name="passwordAgain">
  </label><br>
  <span id="passwordError"></span><br>

  <button>Sign up!</button>
</form>
</div>
</div>
</div>
</main>
<footer>

  <p>CST 336 Internet Programming.</p>
  <img src="img/logo.jpg" alt="CSUMB logo">
</footer>
<script src="js/script.js"></script>
</body>
</html>
